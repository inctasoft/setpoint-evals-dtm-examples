services:
  # DTM Init Container (Development)
  # Runs TypeORM migrations before app starts
  init-typeorm:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile.db-init
      network: host
    image: dtm-init-typeorm:latest
    container_name: ${COMPOSE_PROJECT_NAME:-dtm}-init-typeorm
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      # Runtime mount (not build-time COPY, see Dockerfile.db-init) — the "migrate"
      # script cats ../../.env directly, so this keeps a stale image reading the
      # CURRENT host .env instead of whatever was baked in at image build time.
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dtm
    profiles:
      - db
    restart: "no" # Run once and exit

  # DTM Orchestrator (Development with Debug Mode Always Enabled)
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile.dev
      network: host
    image: dtm-orchestrator:latest
    container_name: ${COMPOSE_PROJECT_NAME:-dtm}-orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway" # Enable host.docker.internal on Linux/WSL2
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - KAFKA_BROKER=${KAFKA_BROKER:-dtm-kafka:29092}
      # Setpoint Evals discovery (services/orchestrator/src/evals) — filesystem-live,
      # never a bundled manifest. Paths match the read-only bind mounts below.
      - EVALS_SETPOINT_EVALS_PATH=/app/evals-src/setpoint-evals
      - EVALS_WORKFLOWS_PATH=/app/evals-src/workflows
      # Dev-only escape hatch for POST /api/v1/evals/:suite/:id/run. Default true in
      # dev compose; set to false to disable re-issuing eval fixtures as real jobs.
      - ENABLE_EVAL_RUN_API=${ENABLE_EVAL_RUN_API:-true}
    ports:
      - "3002:3000"
      - "9230:9229" # Node.js debugger port (always enabled)
    volumes:
      # Mount source code for hot reload
      - ./services/orchestrator/src:/app/services/orchestrator/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/kafka-consumer/src:/app/packages/kafka-consumer/src
      # Mount workspace package dist folders (required for workspace dependencies)
      - ./packages/database/dist:/app/packages/database/dist
      - ./packages/kafka-producer/dist:/app/packages/kafka-producer/dist
      - ./packages/kafka-consumer/dist:/app/packages/kafka-consumer/dist
      - ./packages/core/dist:/app/packages/core/dist
      # Note: orchestrator dist folder is NOT mounted to avoid conflicts with NestJS deleteOutDir
      # Setpoint Evals README estate — READ-ONLY (discovery reads live, never writes).
      # Host paths are configurable so a worktree checkout can point at its own copy.
      - ${SETPOINT_EVALS_HOST_PATH:-./setpoint-evals}:/app/evals-src/setpoint-evals:ro
      - ${WORKFLOWS_HOST_PATH:-./workflows}:/app/evals-src/workflows:ro
    # Start with debugger enabled and watch mode
    command:
      [
        "sh",
        "-c",
        "cd /app/services/orchestrator && pnpm exec nest start --debug=0.0.0.0:9229 --watch",
      ]
    depends_on:
      db:
        condition: service_healthy
      init-typeorm:
        condition: service_completed_successfully
    networks:
      - dtm
    profiles:
      - orchestrator
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/api/v1/health'', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on(''error'', () => process.exit(1))" ',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dtm}-db
    environment:
      - POSTGRES_USER=${DTM_DB_USER}
      - POSTGRES_PASSWORD=${DTM_DB_PASSWORD}
      - POSTGRES_DB=${DTM_DB_NAME}
    ports:
      - "${DTM_DB_PORT_HOST:-5448}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-all-databases.sh:/docker-entrypoint-initdb.d/init-all-databases.sh:ro
      # Canonical workflow seeds — the SAME files the per-workflow source-db
      # containers load. init-all-databases.sh replays them verbatim so the
      # dtm-db copies (which the Lambda workers actually read) can never drift
      # from workflows/*/source-db/init-scripts/. Do NOT inline seed SQL.
      - ./workflows/order-processing/source-db/init-scripts/01-schema-and-seed.sql:/dtm-workflow-seeds/order-processing.sql:ro
      - ./workflows/iot-sensor-pipeline/source-db/init-scripts/01-schema-and-seed.sql:/dtm-workflow-seeds/iot-sensor-pipeline.sql:ro
      - ./workflows/infra-provisioning/source-db/init-scripts/01-schema-and-seed.sql:/dtm-workflow-seeds/infra-provisioning.sql:ro
    networks:
      - dtm
    profiles:
      - db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${DTM_DB_USER} -d ${DTM_DB_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  # Dev Acknowledgement Simulator (Development Only - Standalone Mode)
  # ⚠️  This service simulates external system acknowledgements for testing
  # Only runs in standalone mode (not in integrated mode with the external system)
  dev-ack-simulator:
    build:
      # Repo-root context: the zmq event bus client type-checks against
      # packages/core sources (tsconfig paths); runtime gets @dtm/core via the
      # volume mounts below.
      context: .
      dockerfile: tools/dev-ack-simulator/Dockerfile
      network: host
    image: dtm-dev-ack-simulator:latest
    container_name: ${COMPOSE_PROJECT_NAME:-dtm}-dev-ack-simulator
    restart: unless-stopped # Auto-restart on crashes (e.g., Kafka disconnects)
    environment:
      - NODE_ENV=development
      - KAFKA_BROKERS=${KAFKA_BROKER:-dtm-kafka:29092}
      - PORT=3001
      - WORKFLOW_CONFIG_PATHS=/app/wf-order-processing/workflow.config.js,/app/wf-iot-sensor-pipeline/workflow.config.js,/app/wf-infra-provisioning/workflow.config.js
      - WORKFLOW_CONFIG_PATH=/app/wf-order-processing/workflow.config.js
      - ACK_DEFAULTS_PATH=/app/wf-order-processing/dev-tools/ack-defaults.js
      # Explicit per-var passthrough of the ONLY .env vars this container reads
      # (bus-profile shim: BUS_PROFILE=zmq expands to QUEUE_TRANSPORT/EVENT_BUS=zmq,
      # explicit per-var env wins, "" defaults to aws — tools/dev-ack-simulator/src/bus-profile.ts).
      # Do NOT re-add a blanket dotenv passthrough here: .env is the ORCHESTRATOR's env and
      # carries its Supertokens auth vars, which this container reads none of — the blanket
      # passthrough leaked all 3 into the container env (reads-census pinned by SE-41).
      - BUS_PROFILE=${BUS_PROFILE:-aws}
      - QUEUE_TRANSPORT=${QUEUE_TRANSPORT:-}
      - EVENT_BUS=${EVENT_BUS:-}
    volumes:
      - ./workflows/order-processing/dist:/app/wf-order-processing:ro
      - ./workflows/iot-sensor-pipeline/dist:/app/wf-iot-sensor-pipeline:ro
      - ./workflows/infra-provisioning/dist:/app/wf-infra-provisioning:ro
      # Mount ack simulator dist for dev iteration (pnpm build + docker restart)
      - ./tools/dev-ack-simulator/dist:/app/dist:ro
      # @dtm/core is an optionalDependency (standalone image install cannot
      # resolve workspace:*) — provide it read-only at runtime. The zmq event
      # bus client (EVENT_BUS=zmq) needs its envelope helpers; the kafka
      # profile ignores it.
      - ./packages/core/dist:/app/node_modules/@dtm/core/dist:ro
      - ./packages/core/package.json:/app/node_modules/@dtm/core/package.json:ro
    ports:
      - "3003:3001"
    networks:
      - dtm
    profiles:
      - dev-tools
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3001/health'', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on(''error'', () => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  dtm:
    external: true
