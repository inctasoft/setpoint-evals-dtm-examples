# ============================================================================
# Docker Compose - ZeroMQ task transport (Phase 2, MIXED MODE)
# ============================================================================
# Mixed mode = zmq TASKS + Kafka EVENTS unchanged (EventBus work is Phase 3).
# The zmq-worker-host services below replace the sqs-poller in the task path:
# each is a DEALER connected to the orchestrator's ROUTER, serving ONE
# workflow's queues with the same in-process handler invocation the
# sqs-poller's debug-server mode uses.
#
# Activation (two parts, both required):
#   1. QUEUE_TRANSPORT=zmq in .env (orchestrator reads it via env_file), then
#      force-recreate the orchestrator.
#   2. Include this file + the zmq-tasks profile on the compose command line:
#        docker compose --env-file .env \
#          -f docker-compose.yml -f docker-compose.kafka.yml -f docker-compose.zmq.yml \
#          --profile db --profile orchestrator --profile dev-tools --profile kafka \
#          --profile zmq-tasks up -d
#
# Prerequisites: workspace dists must exist on the host (the worker-host
# containers mount them read-only, same pattern as the sqs-poller):
#   pnpm run build:packages && pnpm run build:workflows
#
# Scale replicas per workflow (fair-queued round-robin by the registry):
#   docker compose ... up -d --scale zmq-worker-host-order-processing=3
#
# With QUEUE_TRANSPORT unset/sqs this file is inert — the orchestrator env
# additions below only take effect when the zmq profile is selected.
# ============================================================================

services:
  # Orchestrator ROUTER bind additions (merged over docker-compose.yml).
  orchestrator:
    environment:
      - ZMQ_TASKS_ENDPOINT=${ZMQ_TASKS_ENDPOINT:-tcp://0.0.0.0:5557}
      - ZMQ_TASK_ACK_TIMEOUT_MS=${ZMQ_TASK_ACK_TIMEOUT_MS:-2000}
      - ZMQ_WORKER_SILENCE_MS=${ZMQ_WORKER_SILENCE_MS:-15000}
      - ZMQ_WORKER_SWEEP_INTERVAL_MS=${ZMQ_WORKER_SWEEP_INTERVAL_MS:-5000}
    ports:
      # Host exposure is optional (debugging host-side workers); worker hosts
      # reach the ROUTER over the internal dtm network at orchestrator:5557.
      - "${ZMQ_TASKS_PORT_HOST:-5557}:5557"

  # ============================================================================
  # Worker hosts — one service per workflow, compose-scaled for replicas
  # ============================================================================
  zmq-worker-host-order-processing:
    build:
      context: tools/zmq-worker-host
      dockerfile: Dockerfile.dev
      network: host
    image: dtm-zmq-worker-host:latest
    # No container_name — scalable (--scale ...=N); each replica mints its own
    # WORKER_ID from the container hostname.
    environment:
      - WORKFLOW_NAME=order-processing
      - ZMQ_TASKS_ENDPOINT=tcp://orchestrator:5557
      - ZMQ_HEARTBEAT_INTERVAL_MS=${ZMQ_HEARTBEAT_INTERVAL_MS:-5000}
    volumes:
      - ./tools/zmq-worker-host/src:/app/src:ro
      - ./packages/core/dist:/app/node_modules/@dtm/core/dist:ro
      - ./packages/core/package.json:/app/node_modules/@dtm/core/package.json:ro
      - ./packages/worker-sdk/dist:/app/node_modules/@dtm/worker-sdk/dist:ro
      - ./packages/worker-sdk/package.json:/app/node_modules/@dtm/worker-sdk/package.json:ro
      - ./workflows/order-processing/dist:/app/node_modules/@dtm-workflows/order-processing/dist:ro
      - ./workflows/order-processing/package.json:/app/node_modules/@dtm-workflows/order-processing/package.json:ro
      - ./workflows/order-processing/workers/src:/app/node_modules/@dtm-workflows/order-processing-workers/src:ro
      - ./workflows/order-processing/workers/package.json:/app/node_modules/@dtm-workflows/order-processing-workers/package.json:ro
      - ./workflows/order-processing/source-db/dist:/app/node_modules/@dtm-workflows/order-processing-typeorm/dist:ro
      - ./workflows/order-processing/source-db/package.json:/app/node_modules/@dtm-workflows/order-processing-typeorm/package.json:ro
    networks:
      - dtm
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - zmq-tasks

  zmq-worker-host-iot-sensor-pipeline:
    build:
      context: tools/zmq-worker-host
      dockerfile: Dockerfile.dev
      network: host
    image: dtm-zmq-worker-host:latest
    environment:
      - WORKFLOW_NAME=iot-sensor-pipeline
      - ZMQ_TASKS_ENDPOINT=tcp://orchestrator:5557
      - ZMQ_HEARTBEAT_INTERVAL_MS=${ZMQ_HEARTBEAT_INTERVAL_MS:-5000}
    volumes:
      - ./tools/zmq-worker-host/src:/app/src:ro
      - ./packages/core/dist:/app/node_modules/@dtm/core/dist:ro
      - ./packages/core/package.json:/app/node_modules/@dtm/core/package.json:ro
      - ./packages/worker-sdk/dist:/app/node_modules/@dtm/worker-sdk/dist:ro
      - ./packages/worker-sdk/package.json:/app/node_modules/@dtm/worker-sdk/package.json:ro
      - ./workflows/iot-sensor-pipeline/dist:/app/node_modules/@dtm-workflows/iot-sensor-pipeline/dist:ro
      - ./workflows/iot-sensor-pipeline/package.json:/app/node_modules/@dtm-workflows/iot-sensor-pipeline/package.json:ro
      - ./workflows/iot-sensor-pipeline/workers/src:/app/node_modules/@dtm-workflows/iot-sensor-pipeline-workers/src:ro
      - ./workflows/iot-sensor-pipeline/workers/package.json:/app/node_modules/@dtm-workflows/iot-sensor-pipeline-workers/package.json:ro
      - ./workflows/iot-sensor-pipeline/source-db/dist:/app/node_modules/@dtm-workflows/iot-sensor-pipeline-typeorm/dist:ro
      - ./workflows/iot-sensor-pipeline/source-db/package.json:/app/node_modules/@dtm-workflows/iot-sensor-pipeline-typeorm/package.json:ro
    networks:
      - dtm
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - zmq-tasks

  zmq-worker-host-infra-provisioning:
    build:
      context: tools/zmq-worker-host
      dockerfile: Dockerfile.dev
      network: host
    image: dtm-zmq-worker-host:latest
    environment:
      - WORKFLOW_NAME=infra-provisioning
      - ZMQ_TASKS_ENDPOINT=tcp://orchestrator:5557
      - ZMQ_HEARTBEAT_INTERVAL_MS=${ZMQ_HEARTBEAT_INTERVAL_MS:-5000}
    volumes:
      - ./tools/zmq-worker-host/src:/app/src:ro
      - ./packages/core/dist:/app/node_modules/@dtm/core/dist:ro
      - ./packages/core/package.json:/app/node_modules/@dtm/core/package.json:ro
      - ./packages/worker-sdk/dist:/app/node_modules/@dtm/worker-sdk/dist:ro
      - ./packages/worker-sdk/package.json:/app/node_modules/@dtm/worker-sdk/package.json:ro
      - ./workflows/infra-provisioning/dist:/app/node_modules/@dtm-workflows/infra-provisioning/dist:ro
      - ./workflows/infra-provisioning/package.json:/app/node_modules/@dtm-workflows/infra-provisioning/package.json:ro
      - ./workflows/infra-provisioning/workers/src:/app/node_modules/@dtm-workflows/infra-provisioning-workers/src:ro
      - ./workflows/infra-provisioning/workers/package.json:/app/node_modules/@dtm-workflows/infra-provisioning-workers/package.json:ro
      - ./workflows/infra-provisioning/source-db/dist:/app/node_modules/@dtm-workflows/infra-provisioning-typeorm/dist:ro
      - ./workflows/infra-provisioning/source-db/package.json:/app/node_modules/@dtm-workflows/infra-provisioning-typeorm/package.json:ro
    networks:
      - dtm
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - zmq-tasks

networks:
  dtm:
    external: true
