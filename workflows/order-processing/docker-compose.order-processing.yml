version: '3.8'

services:
  dtm-order-processing-source-db:
    image: postgres:16-alpine
    container_name: dtm-order-processing-source-db
    ports:
      - "5449:5432"
    environment:
      POSTGRES_DB: order_processing_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    volumes:
      - ./source-db/init-scripts:/docker-entrypoint-initdb.d
      - order-processing-pgdata:/var/lib/postgresql/data
    networks:
      - dtm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U order_user -d order_processing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  order-processing-pgdata:

networks:
  dtm:
    external: true
